name: CI
on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]
runs-on: linux-tiny-bun-rust
timeout-minutes: 30
steps:
  - name: Install dependencies
    run: bun install --frozen-lockfile
    timeout-minutes: 5
  - name: Typecheck and lint
    run: bun x tsc -p tsconfig.json --noEmit && bun x @biomejs/biome check src test bench scripts index.ts
    timeout-minutes: 8
  - name: Check Rust
    run: PATH="/usr/local/cargo/bin:$PATH" cargo test --manifest-path rust/Cargo.toml
    timeout-minutes: 8
  - name: Test
    run: bun test
    timeout-minutes: 12
