name: Native host validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate on Linux x64
        if: runner.os == 'Linux'
        run: bash scripts/verify-linux.sh 15
      - name: Validate on Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Rounds 15
      - name: Validate on macOS arm64
        if: runner.os == 'macOS'
        run: bun run verify:native-host -- --rounds 15
      - name: Upload host report
        uses: actions/upload-artifact@v4
        with:
          name: native-host-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/native-host-*.json
          if-no-files-found: error
