name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: examples/js-library
      - run: bun test
        working-directory: examples/js-library
      - run: bun install --frozen-lockfile
        working-directory: examples/wasm-browser
      - run: bun run build
        working-directory: examples/wasm-browser

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Fast-fail on type errors before spending time on tests.
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Rebuild WASM from Rust sources
        run: |
          rustup target add wasm32-unknown-unknown
          bun run build:wasm
      - name: Build native library (Rust)
        run: |
          rustup toolchain install stable --profile minimal
          cargo --version
          bun run build:rust || echo "::warning::native build unavailable; running pure-JS/WASM tests only"
      - name: Set up Python for parity baselines
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python NLTK baseline deps
        run: |
          python3 -m pip install --upgrade pip
          pip install nltk==3.10.3 numpy scipy
      - name: Run tests
        run: bun test ./test

  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: pip install nltk==3.10.3 numpy scipy
      - name: Rebuild WASM from Rust sources
        run: |
          rustup target add wasm32-unknown-unknown
          bun run build:wasm
      - run: bun run fixtures:import:nltk
      - name: Run strict fidelity gate
        if: always()
        run: bun run fidelity:gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavioral-fidelity
          path: artifacts/fidelity-report.json
          if-no-files-found: error

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: |
          rustup target add wasm32-unknown-unknown
          bun run build:wasm
      - run: bunx --no-install playwright install --with-deps chromium firefox webkit
      - run: bun run verify:portable

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust fmt + clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt clippy
          rustup target add wasm32-unknown-unknown
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml

  loc-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any non-grandfathered .ts/.rs file exceeds 600 LOC
        run: bash scripts/loc-guard.sh 600
