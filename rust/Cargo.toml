[package]
name = "bun_nltk"
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
description = "Native core for bun_nltk (Rust backend replacing Zig)"

[lib]
name = "bun_nltk"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
