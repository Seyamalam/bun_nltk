[package]
name = "bun_nltk"
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
description = "Native core for bun_nltk (Rust backend replacing Zig)"

[lib]
name = "bun_nltk"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = { version = "=1.13.1", default-features = false, features = ["std"] }
