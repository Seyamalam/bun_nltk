[package]
name = "bun_nltk"
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
description = "Native core for bun_nltk (Rust backend replacing Zig)"

[lib]
name = "bun_nltk"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Browser bundle profile: same sources as release, tuned for download size.
# Native builds keep opt-level 3; only the wasm32 build uses this profile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
regex-lite = "=0.1.9"
