version: v1.0
name: bun_nltk native Windows x64
# Project initialization remains on hosted Linux, not a Windows init agent.
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
execution_time_limit:
  minutes: 45
blocks:
  - name: Real Windows x64 MSVC build and host verification
    task:
      agent:
        machine:
          # User-created agent type, NOT a Semaphore hosted Windows label.
          type: s1-bun-nltk-windows-x64
      jobs:
        - name: Native x64 DLL, WASM and installed tarball
          commands:
            - checkout
            - $repo = $env:SEMAPHORE_GIT_DIR; if (-not [IO.Path]::IsPathRooted($repo)) { $repo = Join-Path $env:USERPROFILE $repo }; Set-Location $repo; & ./scripts/ci/native-windows.ps1
